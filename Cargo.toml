[package]
name = "httpr"
version = "0.1.3"
edition = "2024"

authors = [ "Martin Maartensson <martinmaartensson@gmail.com>" ]
description = "A lightweight HTTP router for Hyper"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maartensson/httpr"
homepage = "https://github.com/maartensson/httpr"
docs = "https://docs.rs/httpr"
readme = "README.md"
keywords = ["http", "hyper", "router", "web"]
categories = ["web-programming"]

[dependencies]
bytes = "1"
http = "1"

# http1
httparse = "1"

# event loop 
mio = { version = "1", features = ["net", "os-poll"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# http3
quiche = "0.30"
rand = "0.9"
boring = "5.4.0"
